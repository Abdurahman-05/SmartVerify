<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px;height:100%;box-sizing:border-box}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.p{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 4px;border-top:1px solid rgba(0,0,0,.07);text-decoration:none;color:#1E1A1C}
.av{width:44px;height:44px;border-radius:22px;background:var(--tile);color:var(--p);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap}
.btn{width:100%;height:58px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px rgba(30,20,25,.18)}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div><h1 class="h1">Staff</h1><div class="sub">6 people · Restaurant Plus</div></div>
</div>
<section class="g" style="padding:0 12px">
<a class="p" href="#" style="border-top:0"><span class="av">M</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Meron</div><div class="sub">09 11 22 33 44</div></div><span class="tag" style="background:var(--p);color:#fff">Manager</span></a>
<a class="p" href="#"><span class="av">D</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Dawit</div><div class="sub">09 12 34 56 78</div></div><span class="tag" style="background:var(--tile);color:var(--p)">Waiter</span></a>
<a class="p" href="#"><span class="av">A</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Almaz</div><div class="sub">09 13 45 67 89</div></div><span class="tag" style="background:#FFF0C2;color:#6B4B00">Chef</span></a>
<a class="p" href="#"><span class="av">H</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Hana</div><div class="sub">09 14 56 78 90</div></div><span class="tag" style="background:var(--tile);color:var(--p)">Waiter</span></a>
<a class="p" href="#"><span class="av">Y</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Yonas</div><div class="sub">09 15 67 89 01</div></div><span class="tag" style="background:var(--tile);color:var(--p)">Waiter</span></a>
<a class="p" href="#" style="opacity:.7"><span class="av" style="background:#ECE8EA;color:#4A4246">S</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Selam</div><div class="sub">Paused</div></div><span class="tag" style="background:#ECE8EA;color:#4A4246">Waiter</span></a>
</section>
<div style="flex-grow:1"></div>
<button class="btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add staff</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
