<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:10px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.sub{font-size:14px;color:#5E5559}
.lb{font-size:13px;font-weight:700;color:#5E5559;padding:8px 4px 4px}
.it{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 4px;border-top:1px solid rgba(0,0,0,.07);font-size:15px;font-weight:600;color:#1E1A1C;text-decoration:none}
.ii{width:34px;height:34px;border-radius:10px;background:var(--tile);color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch{color:#8A8085}
.sw{width:32px;height:32px;border-radius:16px;border:0;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px;border-radius:40px;display:flex;align-items:center;gap:10px}
.nb{width:52px;height:52px;border-radius:26px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative;color:#1E1A1C}
.nb.on{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(30,20,25,.25)}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#D9342B;border:2px solid #fff;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 4px}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<section class="g" style="padding:14px 16px;display:flex;align-items:center;gap:14px">
<div style="width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 70%,#fff),var(--p));color:#fff;font-family:Sora,sans-serif;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center">A</div>
<div style="flex:1"><div style="font-family:Sora,sans-serif;font-size:19px;font-weight:700">Ale Bekele</div><div class="sub">Owner · Shewa Mini Market</div></div>
<span style="height:28px;padding:0 10px;border-radius:14px;background:#F5B301;color:#1E1A1C;font-size:13px;font-weight:700;display:inline-flex;align-items:center">Restaurant Plus</span>
</section>

<section class="g" style="padding:12px 16px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:15px;font-weight:700">Color theme</span><span class="sub">Rose</span></div>
<div style="display:flex;justify-content:space-between;margin-top:10px">
<button class="sw" aria-label="Forest theme" style="background:#0D4A36"></button><button class="sw" aria-label="Ocean theme" style="background:#0B3D6B"></button><button class="sw" aria-label="Royal theme" style="background:#3F2A7A"></button><button class="sw" aria-label="Teal theme" style="background:#0B4F55"></button><button class="sw" aria-label="Slate theme" style="background:#26323F"></button><button class="sw" aria-label="Rose theme, selected" style="background:#9D174D;box-shadow:0 0 0 3px #fff,0 0 0 5px #9D174D"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><button class="sw" aria-label="Berry theme" style="background:#6B1F5E"></button>
</div>
</section>

<section class="g" style="padding:2px 12px 2px">
<div class="lb">BUSINESS</div>
<a class="it" href="#" style="border-top:0"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7"/></svg></span><span style="flex:1">Staff</span><span class="sub">6</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="it" href="#"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span style="flex:1">Menu</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="it" href="#"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span style="flex:1">Tables</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="it" href="#"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="7" width="13" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></span><span style="flex:1">Fees &amp; delivery</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="it" href="#"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg></span><span style="flex:1">Bank accounts</span><span class="sub">2</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</section>

<section class="g" style="padding:2px 12px 2px">
<div class="lb">APP</div>
<div class="it" style="border-top:0"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/></svg></span><span style="flex:1">Language</span><span style="display:flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.06)"><button style="height:38px;padding:0 10px;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:14px;font-weight:700;cursor:pointer">EN</button><button style="height:38px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:#1E1A1C;font-family:'Noto Sans Ethiopic','DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer">አማ</button></span></div>
<a class="it" href="#"><span class="ii"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span style="flex:1">Change PIN</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="it" href="#" style="color:#B3261E"><span class="ii" style="background:#FBE0DD;color:#B3261E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></span><span style="flex:1">Sign out</span></a>
</section>
</div>

<nav class="g nav" aria-label="Main">
<button class="nb" aria-label="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></button>
<button class="nb" aria-label="Verify"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></button>
<button class="nb" aria-label="History"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
<button class="nb" aria-label="Alerts, 1 new"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="bd">1</span></button>
<button class="nb on" aria-label="Profile" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
