<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reports</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.h2{margin:0;font-size:16px;font-weight:700}
.num{font-family:Sora,sans-serif;font-weight:700}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.chip{height:44px;padding:0 14px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.bar{flex:1;border-radius:6px 6px 2px 2px;background:var(--p)}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.07);font-size:15px}
.dl{flex:1;height:52px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1"><h1 class="h1">Reports</h1><div class="sub">Today · Sat 14 Nov</div></div>
<button class="g ib" aria-label="Pick a day"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
</div>
<div style="display:flex;gap:8px;overflow:hidden"><button class="g chip on">Sales</button><button class="g chip">Food &amp; drink</button><button class="g chip">Expenses</button><button class="g chip">Staff</button></div>

<section class="g" style="padding:16px">
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<div><div style="font-size:13px;font-weight:700;color:#5E5559">SALES</div><div class="num" style="font-size:28px">18,200 <span style="font-size:15px">ETB</span></div></div>
<span style="height:28px;padding:0 10px;border-radius:14px;background:#DDF3E8;color:#0B5A38;font-size:13px;font-weight:700;display:inline-flex;align-items:center">+12% vs last Sat</span>
</div>
<div style="display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:14px" aria-label="Sales by hour, highest at 13:00" role="img">
<div class="bar" style="height:18%;opacity:.45"></div><div class="bar" style="height:30%;opacity:.55"></div><div class="bar" style="height:42%;opacity:.65"></div><div class="bar" style="height:88%"></div><div class="bar" style="height:100%"></div><div class="bar" style="height:64%;opacity:.8"></div><div class="bar" style="height:36%;opacity:.6"></div><div class="bar" style="height:52%;opacity:.7"></div><div class="bar" style="height:74%;opacity:.85"></div><div class="bar" style="height:40%;opacity:.6"></div>
</div>
<div style="display:flex;justify-content:space-between;font-size:13px;color:#5E5559;margin-top:6px"><span>08:00</span><span>13:00</span><span>18:00</span></div>
</section>

<section class="g" style="padding:6px 16px">
<div class="ln" style="border-top:0"><span style="flex:1">Bank</span><span class="num">11,400</span></div>
<div class="ln"><span style="flex:1">Cash</span><span class="num">6,800</span></div>
<div class="ln"><span style="flex:1">Orders</span><span class="num">31</span></div>
<div class="ln"><span style="flex:1">Average bill</span><span class="num">587</span></div>
<div class="ln"><span style="flex:1">Busiest hour</span><span class="num">13:00</span></div>
</section>

<div style="display:flex;gap:10px">
<button class="g dl" style="color:var(--pt)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</button>
<button class="g dl" style="color:var(--pt)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>CSV</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
