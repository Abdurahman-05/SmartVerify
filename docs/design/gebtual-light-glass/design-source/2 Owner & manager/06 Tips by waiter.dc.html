<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tips by waiter</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0;height:100%;box-sizing:border-box}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.chip{height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.w{display:flex;align-items:center;gap:12px;padding:12px 14px}
.wa{width:44px;height:44px;border-radius:22px;background:var(--tile);color:var(--p);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mp{height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;background:#DDF3E8;color:#0B5A38}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px rgba(30,20,25,.18)}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div><h1 class="h1">Tips by waiter</h1><div class="sub">Tips are not counted as sales</div></div>
</div>
<div style="display:flex;gap:8px"><button class="g chip on">Today</button><button class="g chip">7 days</button><button class="g chip">30 days</button></div>

<section class="g" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#5E5559">TIPS TO PAY OUT</div><div class="num" style="font-size:28px">640 <span style="font-size:15px">ETB</span></div><div class="sub">3 waiters · 9 tips</div></div>
<span style="width:56px;height:56px;border-radius:18px;background:linear-gradient(180deg,#FFD866,#E39A1B);display:flex;align-items:center;justify-content:center;color:#5C3B00;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6-1 1.4-2.5 1.9-2.5.9-2.5 1.9 1 1.6 2.5 1.6 2.5-.5 2.5-1.5"/></svg></span>
</section>

<section class="g w"><span class="wa">D</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Dawit</div><div class="sub">4 tips · bank 180 · cash 100</div></div><div class="num" style="font-size:17px;margin-right:4px">280</div><button class="mp">Mark paid</button></section>
<section class="g w"><span class="wa">A</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Almaz</div><div class="sub">3 tips · bank 160 · cash 60</div></div><div class="num" style="font-size:17px;margin-right:4px">220</div><button class="mp">Mark paid</button></section>
<section class="g w"><span class="wa">H</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Hana</div><div class="sub">2 tips · bank 140</div></div><div class="num" style="font-size:17px;margin-right:4px">140</div><button class="mp">Mark paid</button></section>
<section class="g w" style="opacity:.75"><span class="wa">Y</span><div style="flex:1"><div style="font-size:16px;font-weight:700">Yonas</div><div class="sub">1 tip · cash 50</div></div><span class="tag">Paid</span></section>

<div style="flex-grow:1"></div>
<div style="padding-bottom:16px"><button class="btn">Mark all as paid out · 640 ETB</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
