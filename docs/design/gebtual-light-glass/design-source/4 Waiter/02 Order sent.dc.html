<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order sent</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 50% 18%,var(--tile) 0%,rgba(255,255,255,0) 50%),radial-gradient(circle at 100% 60%,#FFE7AE 0%,rgba(255,231,174,0) 36%),var(--tint)}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.num{font-family:Sora,sans-serif;font-weight:700}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.07);font-size:15px}
.q{width:30px;height:30px;border-radius:9px;background:var(--tile);color:var(--p);font-weight:700;display:flex;align-items:center;justify-content:center}
.btn{width:100%;height:58px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px rgba(30,20,25,.18)}
.btn2{width:100%;height:52px;border-radius:16px;color:var(--pt);font-size:16px;font-weight:700;cursor:pointer}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div style="display:flex;flex-direction:column;gap:12px;padding:56px 16px 16px;height:100%;box-sizing:border-box">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
<div style="width:96px;height:96px;border-radius:48px;background:var(--tile);display:flex;align-items:center;justify-content:center"><div style="width:74px;height:74px;border-radius:37px;background:var(--p);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 12px 24px rgba(30,20,25,.25)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></div></div>
<h1 style="margin:0;font-family:Sora,sans-serif;font-size:26px;font-weight:700">Sent to the kitchen</h1>
<div style="font-size:15px;color:#5E5559">Order #214 · Table 12 · You will get an alert when the food is ready.</div>
</div>
<section class="g" style="padding:6px 16px">
<div class="li" style="border-top:0"><span class="q">2</span><span style="flex:1;font-weight:600">Doro wat</span><span class="num">760</span></div>
<div class="li"><span class="q">1</span><span style="flex:1;font-weight:600">Shiro</span><span class="num">180</span></div>
<div class="li"><span style="flex:1;color:#5E5559">Note: Less spicy</span></div>
<div class="li"><span style="flex:1;font-weight:700">Total</span><span class="num" style="font-size:20px;color:var(--p)">940 ETB</span></div>
</section>
<div style="flex-grow:1"></div>
<button class="btn">New order</button>
<button class="g btn2">See open bills</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
