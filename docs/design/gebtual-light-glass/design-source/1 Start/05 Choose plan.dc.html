<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose plan</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.btn{width:100%;height:58px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px rgba(30,20,25,.18)}
.pl{padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:#1E1A1C;width:100%}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:#3E3539}
.ck svg{color:var(--pt);flex-shrink:0}
.rd{width:24px;height:24px;border-radius:12px;border:2px solid #B9AEB3;flex-shrink:0;box-sizing:border-box}
.chip{height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div style="display:flex;flex-direction:column;gap:12px;padding:24px 16px 24px;height:100%;box-sizing:border-box">

<div><h1 class="h1">Choose your plan</h1><div class="sub">Step 2 of 2 · You can change it later</div></div>
<div style="display:flex;gap:8px"><button class="g chip on">1 month</button><button class="g chip">3 months · save 1,500</button></div>

<button class="g pl" style="border:2px solid var(--p)">
<div style="display:flex;align-items:center;gap:10px"><span class="rd" style="border:7px solid var(--p)"></span><span style="flex:1;font-size:17px;font-weight:700">Restaurant Plus</span><span class="num" style="font-size:20px">4,000 <span style="font-size:13px;font-weight:600;color:#5E5559">ETB/mo</span></span></div>
<span style="align-self:flex-start;margin-left:34px;height:24px;padding:0 9px;border-radius:12px;background:#F5B301;color:#1E1A1C;font-size:13px;font-weight:700;display:inline-flex;align-items:center">Best for restaurants</span>
<div style="margin-left:34px;display:flex;flex-direction:column;gap:4px">
<span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Orders, bills and kitchen screen</span>
<span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Cash, bank, cash + bank and tips</span>
<span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Daily cash ledger and reports</span>
</div>
</button>

<button class="g pl">
<div style="display:flex;align-items:center;gap:10px"><span class="rd"></span><span style="flex:1;font-size:17px;font-weight:700">Normal Verify</span><span class="num" style="font-size:20px">1,000 <span style="font-size:13px;font-weight:600;color:#5E5559">ETB/mo</span></span></div>
<div style="margin-left:34px" class="ck">Verify bank payments · any number of waiters</div>
</button>

<button class="g pl">
<div style="display:flex;align-items:center;gap:10px"><span class="rd"></span><span style="flex:1;font-size:17px;font-weight:700">Normal Multi</span><span class="num" style="font-size:20px">1,500 <span style="font-size:13px;font-weight:600;color:#5E5559">ETB/mo</span></span></div>
<div style="margin-left:34px" class="ck">Verify on any number of phones</div>
</button>

<div style="flex-grow:1"></div>
<button class="btn">Continue · 4,000 ETB</button>
<button style="height:44px;border:0;background:transparent;color:var(--pt);font-size:15px;font-weight:700;cursor:pointer">Explore first, pay later</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
