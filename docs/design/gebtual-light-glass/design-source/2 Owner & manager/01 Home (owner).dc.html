<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button,input{font-family:'DM Sans',sans-serif}
input::placeholder{color:#6B6268}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:26px;font-weight:700;line-height:1.2}
.hi{font-size:14px;font-weight:700;color:var(--pt)}
.sub{font-size:14px;color:#5E5559}
.h2{margin:0;font-size:16px;font-weight:700}
.lk{color:var(--pt);font-size:14px;font-weight:700;text-decoration:none}
.lb{font-size:13px;font-weight:700;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative;color:#1E1A1C}
.av{width:44px;height:44px;border-radius:22px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px rgba(30,20,25,.18)}
.btn2{width:100%;height:52px;border-radius:16px;color:var(--pt);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.hero{border-radius:20px;padding:14px 16px;color:#fff;background:linear-gradient(125deg,color-mix(in srgb,var(--p) 72%,#fff),var(--p) 55%,color-mix(in srgb,var(--p) 78%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 28px rgba(30,20,25,.2)}
.ic{width:42px;height:42px;border-radius:13px;background:var(--tile);color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile{min-height:72px;border-radius:18px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;color:#1E1A1C}
.tt{display:block;font-size:15px;font-weight:700;line-height:1.2}
.ts{display:block;font-size:13px;color:#5E5559;margin-top:2px;line-height:1.2}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap}
.ok{background:#DDF3E8;color:#0B5A38}.wait{background:#FFF0C2;color:#6B4B00}.bad{background:#FBE0DD;color:#8C1D18}.grey{background:#ECE8EA;color:#4A4246}
.nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px;border-radius:40px;display:flex;align-items:center;gap:10px}
.nb{width:52px;height:52px;border-radius:26px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative;color:#1E1A1C}
.nb.on{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(30,20,25,.25)}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#D9342B;border:2px solid #fff;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 4px}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">

<div style="display:flex;align-items:center;justify-content:space-between">
<div><div class="hi">Welcome back, Ale!</div><h1 class="h1">Shewa Mini Market</h1></div>
<div style="display:flex;gap:8px"><button class="g ib" aria-label="Notifications, 1 new"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span style="position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:5px;background:#D9342B"></span></button><div class="av">A</div></div>
</div>

<section class="hero">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div><div style="font-size:13px;font-weight:700;opacity:.88">TODAY · LIVE</div><div class="num" style="font-size:32px;margin-top:2px">18,200 <span style="font-size:16px">ETB</span></div><div style="font-size:14px;opacity:.9">26 payments · Restaurant Plus</div></div>
<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">Live</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">
<div style="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 10px"><div style="font-size:13px;opacity:.9">Verified</div><div class="num" style="font-size:18px">24</div></div>
<div style="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 10px"><div style="font-size:13px;opacity:.9">Pending</div><div class="num" style="font-size:18px;color:#FFD866">1</div></div>
<div style="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 10px"><div style="font-size:13px;opacity:.9">Duplicate</div><div class="num" style="font-size:18px">1</div></div>
</div>
</section>

<button class="btn" style="height:60px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Verify payment<span class="tag" style="background:#F5B301;color:#1E1A1C;margin-left:4px">1 table waiting</span></button>

<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h2">What do you want to do?</h2></div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button class="g tile"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span><span class="tt">New order</span><span class="ts">Send to kitchen</span></span></button>
<button class="g tile"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></span><span><span class="tt">Overview</span><span class="ts">Sales, cash, bank, tips</span></span></button>
<button class="g tile"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 6v13a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span><span class="tt">Money flow</span><span class="ts">Sales, costs, left</span></span></button>
<button class="g tile"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6.6A2 2 0 0 0 5 4v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/></svg></span><span><span class="tt">Buy list</span><span class="ts">4 to buy</span></span></button>
<button class="g tile"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6-1 1.4-2.5 1.9-2.5.9-2.5 1.9 1 1.6 2.5 1.6 2.5-.5 2.5-1.5"/></svg></span><span><span class="tt">Tips</span><span class="ts">By waiter</span></span></button>
<button class="g tile"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><span><span class="tt">Reports</span><span class="ts">Daily and more</span></span></button>
</div>
<a class="lk" href="#" style="text-align:center;padding:4px 0">More: expenses, bank accounts, subscription</a>

</div>

<nav class="g nav" aria-label="Main">
<button class="nb on" aria-label="Home" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></button>
<button class="nb" aria-label="Verify"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></button>
<button class="nb" aria-label="History"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
<button class="nb" aria-label="Alerts, 1 new"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="bd">1</span></button>
<button class="nb" aria-label="Profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
