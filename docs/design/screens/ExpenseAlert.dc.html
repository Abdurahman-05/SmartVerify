<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expense Alert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F8F6}
button,input{font-family:'DM Sans',sans-serif}
</style>
</helmet>
<!-- Owner: push banner (top) and the Alerts tab item for a new expense; tap opens Expense details. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8F6; color: #14201B; display: flex; flex-direction: column; overflow: hidden; position: relative">

<!-- Android push banner -->
<div style="position: absolute; top: 10px; left: 10px; right: 10px; background: #fff; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 12px 14px; display: flex; gap: 12px; z-index: 2">
  <div style="width: 40px; height: 40px; border-radius: 12px; background: #0D4A36; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">ገ</div>
  <div style="flex: 1"><div style="font-size: 14px; color: #3B4A44">ገብቷል · now</div><div style="font-weight: 700; font-size: 16px">New expense · 450 ETB</div><div style="font-size: 15px">Selam: Tomatoes and onions · Cash</div></div>
</div>

<div style="padding: 110px 16px 6px; font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700">Alerts</div>

<div style="padding: 6px 16px; display: flex; flex-direction: column; gap: 8px">
  <!-- unread -->
  <div style="display: flex; gap: 12px; background: #fff; border: 1.5px solid #F5B301; border-radius: 18px; padding: 12px">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: #FFF4D1; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C4400" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></div>
    <div style="flex: 1"><div style="font-weight: 700; font-size: 16px">Selam added an expense</div><div style="font-size: 15px">Tomatoes and onions · <b>450 ETB</b> · Cash</div><div style="font-size: 14px; color: #3B4A44; margin-top: 2px">10:42 · tap to check</div></div>
    <span style="width: 10px; height: 10px; border-radius: 5px; background: #F5B301; margin-top: 6px"></span>
  </div>
  <!-- read -->
  <div style="display: flex; gap: 12px; background: #fff; border: 1.5px solid #DDE5E1; border-radius: 18px; padding: 12px">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: #E6F2EC; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0D4A36" stroke-width="2.2" stroke-linecap="round"><path d="M4 12l5 5L20 6"/></svg></div>
    <div style="flex: 1"><div style="font-weight: 700; font-size: 16px">Today's money</div><div style="font-size: 15px">Sales 18,200 · Expenses 5,750 · Left <b>12,450 ETB</b></div><div style="font-size: 14px; color: #3B4A44; margin-top: 2px">Yesterday, 23:00</div></div>
  </div>
</div>

<div style="flex: 1"></div>
<div style="height: 66px; border-top: 1px solid #DDE5E1; background: #fff; display: flex; justify-content: space-around; align-items: center; font-size: 14px; font-weight: 700; color: #4A5A53">
  <span>Home</span><span>Verify</span><span>History</span><span style="color: #0D4A36">Alerts</span><span>Profile</span>
</div>
</div>
</x-dc>
</body>
</html>
