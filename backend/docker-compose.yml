services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartverify
      POSTGRES_PASSWORD: smartverify_dev_password
      POSTGRES_DB: smartverify
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartverify -d smartverify']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    profiles: ['api']
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://smartverify:smartverify_dev_password@db:5432/smartverify?schema=public
      HOST: 0.0.0.0
    ports:
      - '3000:3000'

volumes:
  db-data:
