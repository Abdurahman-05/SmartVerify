<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New order</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:10px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.seg{display:flex;padding:4px;border-radius:16px;gap:4px}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C}
.seg button.on{background:var(--p);color:#fff}
.chip{height:40px;padding:0 14px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;color:#1E1A1C;white-space:nowrap}
.chip.on{background:var(--tile);color:var(--p);border:2px solid var(--p)}
.mi{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(0,0,0,.07)}
.pl{width:48px;height:48px;border-radius:14px;flex-shrink:0}
.add{height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--tile);color:var(--p);font-size:14px;font-weight:700;cursor:pointer}
.stp{display:flex;align-items:center;height:44px;border-radius:12px;background:var(--p);color:#fff}
.stp button{width:40px;height:44px;border:0;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px;border-radius:40px;display:flex;align-items:center;gap:10px}
.nb{width:52px;height:52px;border-radius:26px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative;color:#1E1A1C}
.nb.on{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(30,20,25,.25)}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#D9342B;border:2px solid #fff;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 4px}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;justify-content:space-between"><div><h1 class="h1">New order</h1><div class="sub">Waiter: Dawit</div></div><div style="width:44px;height:44px;border-radius:22px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">D</div></div>
<div class="g seg"><button class="on">Dine in</button><button>Takeaway</button><button>Delivery</button></div>
<section class="g" style="padding:10px 14px;display:flex;align-items:center;gap:12px">
<span style="width:48px;height:48px;border-radius:14px;background:var(--p);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><span style="font-size:10px;font-weight:700;opacity:.85">TABLE</span><span class="num" style="font-size:20px">12</span></span>
<div style="flex:1"><div class="sub">Ordering for · Main Floor</div><div style="font-size:16px;font-weight:700">Table 12 · 2 guests</div></div>
<button style="height:44px;padding:0 12px;border:0;background:transparent;color:var(--pt);font-size:14px;font-weight:700;cursor:pointer">Change</button>
</section>
<div style="display:flex;gap:8px"><button class="g chip on">All</button><button class="g chip">Food</button><button class="g chip">Drinks</button><button class="g chip">Combos</button></div>
<section class="g" style="padding:2px 14px">
<div class="mi" style="border-top:0"><span class="pl" style="background:radial-gradient(circle at 50% 50%,#8A2F12 0 34%,#D9B77E 35% 70%,#F2EFE8 71%)"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Doro wat</div><div class="sub">380 ETB</div></div><div class="stp"><button aria-label="Remove one Doro wat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="num" style="width:22px;text-align:center">2</span><button aria-label="Add one Doro wat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
<div class="mi"><span class="pl" style="background:radial-gradient(circle at 50% 50%,#C9801B 0 34%,#D9B77E 35% 70%,#F2EFE8 71%)"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Shiro</div><div class="sub">180 ETB</div></div><div class="stp"><button aria-label="Remove one Shiro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="num" style="width:22px;text-align:center">1</span><button aria-label="Add one Shiro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
<div class="mi"><span class="pl" style="background:radial-gradient(circle at 50% 50%,#5A2A12 0 34%,#D9B77E 35% 70%,#F2EFE8 71%)"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Special tibs</div><div class="sub">320 ETB</div></div><button class="add">+ ADD</button></div>
<div class="mi"><span class="pl" style="background:radial-gradient(circle at 50% 50%,#A33A2A 0 34%,#D9B77E 35% 70%,#F2EFE8 71%)"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Kitfo</div><div class="sub">350 ETB</div></div><button class="add">+ ADD</button></div>
</section>
<div style="display:flex;gap:8px;align-items:center"><span class="sub" style="font-weight:700">Tell the kitchen:</span><button class="g chip on" style="height:36px">Less spicy</button><button class="g chip" style="height:36px">Rush</button></div>
</div>

<div style="position:absolute;left:16px;right:16px;bottom:96px;border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(125deg,color-mix(in srgb,var(--p) 72%,#fff),var(--p) 55%,color-mix(in srgb,var(--p) 78%,#000));box-shadow:0 14px 28px rgba(30,20,25,.25)">
<div style="flex:1"><div style="font-size:13px;opacity:.9">3 items</div><div class="num" style="font-size:20px">940 ETB</div></div>
<button style="height:50px;padding:0 16px;border:0;border-radius:14px;background:#fff;color:var(--p);font-size:15px;font-weight:700;cursor:pointer">SEND TO TABLE 12 →</button>
</div>

<nav class="g nav" aria-label="Main">
<button class="nb on" aria-label="New order" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></button>
<button class="nb" aria-label="Verify"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></button>
<button class="nb" aria-label="Activity"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
<button class="nb" aria-label="Alerts, 2 new"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="bd">2</span></button>
<button class="nb" aria-label="Profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
