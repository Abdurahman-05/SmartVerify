<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buy list</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button,input{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.seg{display:flex;padding:4px;border-radius:16px;gap:4px}
.seg button{flex:1;height:46px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C}
.seg button.on{background:var(--p);color:#fff}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px}
.cb{width:28px;height:28px;border-radius:14px;border:2.5px solid #B9AEB3;flex-shrink:0;box-sizing:border-box}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap}
.fld{height:54px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px}
.fld input{flex:1;height:48px;border:0;background:transparent;font-family:Sora,sans-serif;font-size:22px;font-weight:700;color:#1E1A1C;outline:none;padding:0;min-width:0}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div><h1 class="h1">Buy list</h1><div class="sub">What the kitchen needs</div></div>
</div>
<div class="g seg"><button class="on">To buy · 4</button><button>Bought · 2</button></div>

<section class="g" style="border:2px solid var(--p)">
<div class="it"><span class="cb" style="border-color:var(--p)"></span><div style="flex:1"><div style="font-size:17px;font-weight:700">Cooking oil · 2 jerrycans</div><div class="sub">Almaz (chef) · 08:41</div></div><span class="tag" style="background:#FFF0C2;color:#6B4B00">Today</span></div>
<div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:10px">
<label for="pr" style="font-size:14px;font-weight:700">How much did it cost?</label>
<div class="g fld"><input id="pr" value="1,900" inputmode="numeric"><span style="font-weight:700;color:#5E5559">ETB</span></div>
<div class="g seg"><button class="on">Paid cash</button><button>Paid by bank</button></div>
<button class="btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Mark as bought</button>
<div class="sub" style="text-align:center">Saved in Purchases automatically.</div>
</div>
</section>

<section class="g it"><span class="cb"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Napkins · 3 boxes</div><div class="sub">Almaz (chef) · 08:40</div></div><span class="tag" style="background:#FFF0C2;color:#6B4B00">Today</span></section>
<section class="g it"><span class="cb"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Dish soap · 1 pack</div><div class="sub">Almaz (chef) · 08:41</div></div><span class="tag" style="background:#ECE8EA;color:#4A4246">This week</span></section>
<section class="g it"><span class="cb"></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Charcoal · 2 sacks</div><div class="sub">Almaz (chef) · Yesterday</div></div><span class="tag" style="background:#ECE8EA;color:#4A4246">This week</span></section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
