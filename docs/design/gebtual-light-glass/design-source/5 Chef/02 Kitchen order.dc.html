<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen order</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px;height:100%;box-sizing:border-box}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.sub{font-size:14px;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.it{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid rgba(0,0,0,.07);font-size:20px;font-weight:700}
.q{width:44px;height:44px;border-radius:14px;background:var(--p);color:#fff;font-family:Sora,sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{width:100%;height:64px;border:0;border-radius:18px;background:linear-gradient(180deg,#2BC489,#0E7A4E);color:#fff;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px rgba(14,122,78,.3)}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back to kitchen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1;font-size:15px;font-weight:700;color:#5E5559">Cooking for</div>
</div>

<section style="border-radius:22px;padding:18px;color:#fff;background:linear-gradient(125deg,color-mix(in srgb,var(--p) 72%,#fff),var(--p) 55%,color-mix(in srgb,var(--p) 78%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 28px rgba(30,20,25,.2);display:flex;align-items:center;gap:14px">
<div style="flex:1"><div style="font-size:13px;font-weight:700;opacity:.88">TABLE</div><div class="num" style="font-size:52px;line-height:1">12</div><div style="font-size:15px;opacity:.92;margin-top:4px">Order #214 · Waiter: Dawit</div></div>
<div style="text-align:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:10px 14px"><div class="num" style="font-size:28px">9</div><div style="font-size:13px;font-weight:700">min</div></div>
</section>

<section class="g" style="padding:2px 16px">
<div class="it" style="border-top:0"><span class="q">2</span>Doro wat</div>
<div class="it"><span class="q">1</span>Shiro</div>
</section>

<section class="g" style="padding:14px 16px;border:2px solid #F5B301">
<div style="font-size:13px;font-weight:700;color:#6B4B00">NOTES FROM THE WAITER</div>
<div style="font-size:18px;font-weight:700;margin-top:4px">Less spicy</div>
</section>

<div style="flex-grow:1"></div>
<button class="btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Mark as ready</button>
<div class="sub" style="text-align:center">Dawit gets an alert to serve it.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
