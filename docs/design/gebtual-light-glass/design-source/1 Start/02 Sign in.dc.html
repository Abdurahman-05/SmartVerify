<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button,input{font-family:'DM Sans',sans-serif}
input::placeholder{color:#6B6268}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:26px;font-weight:700;line-height:1.2}
.sub{font-size:15px;color:#5E5559}
.lk{color:var(--pt);font-size:15px;font-weight:700;text-decoration:none}
.btn{width:100%;height:58px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px rgba(30,20,25,.18)}
.btn2{width:100%;height:54px;border-radius:16px;color:var(--pt);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.fl{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.fld{height:56px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 14px}
.fld input{flex:1;height:50px;border:0;background:transparent;font-size:17px;color:#1E1A1C;outline:none;padding:0;min-width:0}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div style="display:flex;flex-direction:column;gap:16px;padding:40px 20px 24px;height:100%;box-sizing:border-box">

<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
<div style="width:72px;height:72px;border-radius:22px;background:var(--p);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 24px rgba(30,20,25,.2)"><svg width="52" height="52" viewBox="112 112 352 352" aria-hidden="true"><g transform="translate(203.3 375.0) scale(0.38 -0.38)"><path d="M273 -2Q233 -2 233 51Q233 79 268.5 257.0Q304 435 304 440Q304 476 277.0 505.0Q250 534 214 535Q206 535 192.5 530.0Q179 525 175 524Q177 510 177 503Q177 458 148.0 419.5Q119 381 77 381Q57 381 41.0 388.0Q25 395 17.5 403.0Q10 411 10 415Q10 420 25.0 444.0Q40 468 40 484Q40 489 36.5 497.0Q33 505 33 509Q33 521 53.5 527.0Q74 533 137 539H158Q163 540 182.5 546.5Q202 553 229.0 559.0Q256 565 282 565Q330 565 368.5 527.0Q407 489 407 440V437Q407 435 371.0 252.0Q335 69 335 56Q335 44 339.0 36.5Q343 29 348.5 26.5Q354 24 358.0 21.0Q362 18 362.0 15.0Q362 12 360.5 9.5Q359 7 355.5 6.0Q352 5 349.5 4.5Q347 4 342.5 3.5Q338 3 337.0 3.0Q336 3 324.5 2.0Q313 1 298.0 -0.5Q283 -2 273 -2Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/></g><circle cx="394" cy="404" r="44" fill="#F5B301" stroke="var(--p)" stroke-width="24"/></svg></div>
<h1 class="h1" style="margin-top:6px">Welcome back</h1>
<div class="sub">Sign in to check your payments</div>
</div>

<section class="g" style="padding:18px 16px;display:flex;flex-direction:column;gap:14px">
<div><label class="fl" for="ph">Phone number</label><div class="g fld"><span style="font-size:17px;font-weight:700;color:#5E5559">+251</span><span style="width:1px;height:24px;background:rgba(0,0,0,.12)"></span><input id="ph" placeholder="9XX XXX XXX" inputmode="tel"></div></div>
<div><label class="fl" for="pn">Security PIN</label><div class="g fld"><input id="pn" type="password" placeholder="Enter your PIN" inputmode="numeric"><button aria-label="Show PIN" style="width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#5E5559"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div style="display:flex;justify-content:space-between;align-items:center">
<label style="display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px"><input type="checkbox" checked style="width:22px;height:22px;accent-color:var(--p)">Remember me</label>
<a class="lk" href="#">Forgot PIN?</a>
</div>
<button class="btn">Sign in</button>
<button class="g btn2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v3M8.5 8.5A5 5 0 0 1 17 12v2M7 12a5 5 0 0 0 .5 2.2M12 4a8 8 0 0 1 8 8v1M4 12a8 8 0 0 1 4-6.9M9.5 20c.8-1.6 1.5-3.6 1.5-6M15 20c.6-1.3 1-2.8 1.2-4.4"/></svg>Sign in with fingerprint</button>
</section>

<div style="flex-grow:1"></div>
<div style="text-align:center;font-size:15px;color:#5E5559">Don't have an account? <a class="lk" href="#">Sign up</a></div>
<div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:#5E5559;letter-spacing:.06em"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>SECURE PAYMENT VERIFICATION</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
