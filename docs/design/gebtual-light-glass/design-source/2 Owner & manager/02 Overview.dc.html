<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overview</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button,input{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.h2{margin:0;font-size:16px;font-weight:700}
.lb{font-size:13px;font-weight:700;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.hero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(125deg,color-mix(in srgb,var(--p) 72%,#fff),var(--p) 55%,color-mix(in srgb,var(--p) 78%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 28px rgba(30,20,25,.2)}
.chip{height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.at{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(0,0,0,.07);text-decoration:none;color:#1E1A1C}
.ai{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div><h1 class="h1">Overview</h1><div class="sub">Sales, cash, bank and tips</div></div>
</div>
<div style="display:flex;gap:8px"><button class="g chip on">Today</button><button class="g chip">7 days</button><button class="g chip">30 days</button></div>

<section class="hero">
<div style="font-size:13px;font-weight:700;opacity:.88">TOTAL SALES</div>
<div class="num" style="font-size:34px">18,200 <span style="font-size:16px">ETB</span></div>
<div style="font-size:14px;opacity:.9">31 orders</div>
<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.2)"><div style="width:37%;background:#FFD866"></div><div style="width:63%;background:#fff"></div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px">
<div><div style="display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9"><span style="width:9px;height:9px;border-radius:5px;background:#FFD866"></span>Cash</div><div class="num" style="font-size:18px">6,800</div></div>
<div><div style="display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9"><span style="width:9px;height:9px;border-radius:5px;background:#fff"></span>Bank</div><div class="num" style="font-size:18px">11,400</div></div>
</div>
</section>

<section class="g" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
<span class="ai" style="background:#FFF0C2;color:#6B4B00"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6-1 1.4-2.5 1.9-2.5.9-2.5 1.9 1 1.6 2.5 1.6 2.5-.5 2.5-1.5"/></svg></span>
<div style="flex:1"><div style="font-size:15px;font-weight:700">Tips</div><div class="sub">Tips are not counted as sales</div></div>
<div class="num" style="font-size:18px">640</div>
</section>

<section class="g" style="padding:6px 16px">
<div class="lb" style="padding:10px 0 2px">NEEDS YOUR ATTENTION</div>
<a class="at" href="#" style="border-top:0"><span class="ai" style="background:#FBE0DD;color:#8C1D18"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">1 table not paid yet</span><span class="sub">Open bills</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5559" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="at" href="#"><span class="ai" style="background:#FFF0C2;color:#6B4B00"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="7" width="13" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">1 delivery fee was changed</span><span class="sub">Hana · 80 to 50 ETB</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5559" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a class="at" href="#"><span class="ai" style="background:var(--tile);color:var(--p)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7"/></svg></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">Tips by waiter</span><span class="sub">See and pay out tips</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5559" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
