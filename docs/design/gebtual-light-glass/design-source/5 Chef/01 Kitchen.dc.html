<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button{font-family:'DM Sans',sans-serif}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:26px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.num{font-family:Sora,sans-serif;font-weight:700}
.seg{display:flex;padding:4px;border-radius:16px;gap:4px}
.seg button{flex:1;height:48px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:700;cursor:pointer;color:#1E1A1C;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--p);color:#fff}
.cnt{min-width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.3);font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
.tk{padding:14px;display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.q{width:32px;height:32px;border-radius:10px;background:var(--tile);color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{height:52px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.tag{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap}
.nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px;border-radius:40px;display:flex;align-items:center;gap:10px}
.nb{width:52px;height:52px;border-radius:26px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative;color:#1E1A1C}
.nb.on{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(30,20,25,.25)}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#D9342B;border:2px solid #fff;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 4px}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;justify-content:space-between"><div><h1 class="h1">Kitchen</h1><div class="sub">Chef: Almaz</div></div><button class="g" style="height:44px;padding:0 14px;border-radius:22px;color:var(--pt);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6.6A2 2 0 0 0 5 4v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/></svg>Finished items</button></div>
<div class="g seg"><button class="on">New <span class="cnt">2</span></button><button>Cooking <span class="cnt" style="background:rgba(0,0,0,.08)">3</span></button><button>Ready <span class="cnt" style="background:rgba(0,0,0,.08)">1</span></button></div>

<section class="g tk" style="border:2px solid #E39A1B">
<div style="display:flex;align-items:center;gap:10px"><span style="width:52px;height:52px;border-radius:16px;background:var(--p);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><span style="font-size:10px;font-weight:700;opacity:.85">TABLE</span><span class="num" style="font-size:22px">12</span></span><div style="flex:1"><div style="font-size:16px;font-weight:700">Order #214 · Dine in</div><div class="sub">Waiter: Dawit</div></div><span class="tag" style="background:#FFF0C2;color:#6B4B00"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>6 min</span></div>
<div class="it"><span class="q">2</span>Doro wat</div>
<div class="it"><span class="q">1</span>Shiro</div>
<div style="border-radius:12px;background:#FFF0C2;color:#6B4B00;padding:8px 12px;font-size:14px;font-weight:700">NOTE: Less spicy</div>
<button class="btn">Start cooking</button>
</section>

<section class="g tk">
<div style="display:flex;align-items:center;gap:10px"><span style="width:52px;height:52px;border-radius:16px;background:var(--tile);color:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><span style="font-size:9px;font-weight:700">TAKEAWAY</span><span class="num" style="font-size:20px">#18</span></span><div style="flex:1"><div style="font-size:16px;font-weight:700">For: Mulu T.</div><div class="sub">Waiter: Hana</div></div><span class="tag" style="background:#ECE8EA;color:#4A4246">2 min</span></div>
<div class="it"><span class="q">1</span>Special tibs</div>
<button class="btn">Start cooking</button>
</section>
</div>

<nav class="g nav" aria-label="Main">
<button class="nb on" aria-label="Kitchen" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21a1 1 0 0 0 1-1v-5.35a4 4 0 1 0-4.2-6.9 4 4 0 0 0-3.6 0A4 4 0 1 0 6 14.65V20a1 1 0 0 0 1 1zM6 17h12"/></svg></button>
<button class="nb" aria-label="Alerts, 1 new"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="bd">1</span></button>
<button class="nb" aria-label="Profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
