# One address for everything (CloudFront in front gives HTTPS):
#   /api/…, /docs → the API      everything else → the admin website (static files)
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;   # receipt pictures (base64) are up to ~8 MB

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;   # bank checks and picture reading can take a while
  }

  location /docs {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /srv/admin;
    # Static export: /sign-in → sign-in.html
    try_files $uri $uri.html $uri/index.html /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
