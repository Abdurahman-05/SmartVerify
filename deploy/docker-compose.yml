# Production on one server: PostgreSQL, the API, and Caddy (HTTPS, admin website + /api).
# Secrets come from AWS Parameter Store through update.sh (never in git). See deploy/README.md.
name: smartverify

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartverify
      POSTGRES_USER: smartverify
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    volumes:
      # On the separate data disk, so replacing the server does not lose the database.
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartverify -d smartverify']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file: /opt/smartverify/api.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://smartverify:${DB_PASSWORD}@db:5432/smartverify
      # Caddy adds X-Forwarded-For.
      TRUST_PROXY_HOPS: '1'
    depends_on:
      db:
        condition: service_healthy

  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is not set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/smartverify/admin:/srv/admin:ro
      # Certificates live on the data disk, so they survive a rebuild (Let's Encrypt limits).
      - /data/caddy:/data
    depends_on:
      - api
