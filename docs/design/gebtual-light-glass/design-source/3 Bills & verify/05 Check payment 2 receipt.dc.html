<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check payment: receipt</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1F2}
button,input{font-family:'DM Sans',sans-serif}
input::placeholder{color:#6B6268}
[data-theme=forest]{--p:#0D4A36;--pt:#0D6B47;--tint:#E6F2EC;--tile:#DDEFE6}
[data-theme=ocean]{--p:#0B3D6B;--pt:#0B5CA8;--tint:#E5F0FA;--tile:#D6E7F7}
[data-theme=royal]{--p:#3F2A7A;--pt:#5B3FB0;--tint:#EEEAF8;--tile:#E0D9F2}
[data-theme=teal]{--p:#0B4F55;--pt:#0E7480;--tint:#E3F2F3;--tile:#D2EAEC}
[data-theme=slate]{--p:#26323F;--pt:#3D5A80;--tint:#E8EDF2;--tile:#DAE3EC}
[data-theme=rose]{--p:#9D174D;--pt:#BE185D;--tint:#FDF0F5;--tile:#FADCE8}
[data-theme=berry]{--p:#6B1F5E;--pt:#8E2B7C;--tint:#F7ECF5;--tile:#EFD8EB}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;color:#1E1A1C;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 6% 4%,var(--tile) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 100% 34%,#FFE7AE 0%,rgba(255,231,174,0) 36%),radial-gradient(circle at 22% 100%,var(--tile) 0%,rgba(255,255,255,0) 50%),var(--tint)}
.in{display:flex;flex-direction:column;gap:12px;padding:16px;height:100%;box-sizing:border-box}
.g{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(30,20,25,.08);border-radius:20px}
.h1{margin:0;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;color:#5E5559}
.ib{width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#1E1A1C}
.st{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#5E5559}
.sn{width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:12px}
.btn{width:100%;height:60px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px rgba(30,20,25,.18)}
.btn2{width:100%;height:52px;border-radius:16px;color:var(--pt);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.fl{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.fld{height:54px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 14px}
.fld input{flex:1;height:48px;border:0;background:transparent;font-size:17px;color:#1E1A1C;outline:none;padding:0;min-width:0;letter-spacing:.04em}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
<div class="in">
<div style="display:flex;align-items:center;gap:10px">
<button class="g ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1"><h1 class="h1">Check payment</h1><div class="sub">Table 12 · pay 540 ETB by bank</div></div>
</div>

<div class="g" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:16px">
<span class="st" style="color:#0B5A38"><span class="sn" style="background:#2BB37A;color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Bank</span>
<span style="flex:1;height:2px;background:#2BB37A;margin:0 8px"></span>
<span class="st" style="color:var(--p)"><span class="sn" style="background:var(--p);color:#fff">2</span>Receipt</span>
<span style="flex:1;height:2px;background:rgba(0,0,0,.1);margin:0 8px"></span>
<span class="st"><span class="sn">3</span>Check</span>
</div>

<section class="g" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
<span style="width:40px;height:40px;border-radius:12px;background:#5B2A86;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">CBE</span>
<div style="flex:1"><div class="sub">Customer's bank</div><div style="font-size:16px;font-weight:700">Commercial Bank of Ethiopia</div></div>
<button style="height:44px;padding:0 12px;border:0;background:transparent;color:var(--pt);font-size:14px;font-weight:700;cursor:pointer">Change</button>
</section>

<section class="g" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:16px;font-weight:700">Find these 2 things on the receipt</div>
<div style="display:flex;gap:10px">
<div style="flex:1;border-radius:14px;background:var(--tile);padding:10px 12px"><div style="font-size:13px;font-weight:700;color:var(--p)">1</div><div style="font-size:15px;font-weight:700">Transaction ID</div><div class="sub">starts with FT</div></div>
<div style="flex:1;border-radius:14px;background:var(--tile);padding:10px 12px"><div style="font-size:13px;font-weight:700;color:var(--p)">2</div><div style="font-size:15px;font-weight:700">Sender account</div><div class="sub">full number</div></div>
</div>
<div class="sub">The QR gives them all at once.</div>
<button class="btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>Scan the QR</button>
<button class="g btn2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Read from a screenshot</button>
</section>

<div style="display:flex;align-items:center;gap:10px;color:#5E5559;font-size:13px;font-weight:700"><span style="flex:1;height:1px;background:rgba(0,0,0,.12)"></span>OR TYPE IT<span style="flex:1;height:1px;background:rgba(0,0,0,.12)"></span></div>
<div><label class="fl" for="tid">Transaction ID</label><div class="g fld"><input id="tid" placeholder="FT25…"></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["forest","ocean","royal","teal","slate","rose","berry"],"default":"rose"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'rose' }; }
}
</script>
</body>
</html>
